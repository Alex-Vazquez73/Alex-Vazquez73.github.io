const MOVIL=['Humano','Ballena boreal','Murciélago café','Ratón','Topo estrella','Equidna de hocico corto'];
const R=()=>innerWidth<520?0.75:1;
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
function wrap(t,w){const ws=t.split(' ');let ln='',o=[];for(const x of ws){if((ln+' '+x).trim().length>w){o.push(ln.trim());ln=x;}else ln+=' '+x;}if(ln.trim())o.push(ln.trim());return o;}
const fmt=v=>String(Math.round(v*10)/10);
function curva(k){const o=[];for(let i=0;i<=60;i++){const x=Math.pow(10,Math.log10(9)+i*(Math.log10(700)-Math.log10(9))/60);
  o.push({x:x,y:Math.pow(10,D.a+D.b*Math.log10(x)+k*D.rmse)});}return o;}
const lbl={id:'lbl',afterDatasetsDraw(ch){const ctx=ch.ctx;ctx.save();ctx.font='500 11.5px "IBM Plex Mono",Menlo,monospace';
  const di=ch.data.datasets.findIndex(d=>d.clave);if(di<0)return;const meta=ch.getDatasetMeta(di);
  const chico=ch.width<520;if(chico)ctx.font='500 10px "IBM Plex Mono",Menlo,monospace';
  meta.data.forEach((pt,i)=>{const r=ch.data.datasets[di].data[i];if(r.dx===undefined)return;
    if(chico&&!MOVIL.includes(r.n))return;
    let dx=r.dx,dy=r.dy,al=r.a;
    if(chico&&pt.x>ch.width*0.6&&dx>0){dx=-8;dy=0;al='right';}
    if(chico&&Math.hypot(dx,dy)>15){dx=dx>0?8:-8;dy=0;}
    r.dx_=dx;r.dy_=dy;r.a_=al;
    const lx=pt.x+dx,ly=pt.y+dy;
    if(Math.hypot(dx,dy)>15){ctx.strokeStyle=css('--ink-soft');ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(pt.x,pt.y);ctx.lineTo(lx,ly-4);ctx.stroke();}
    ctx.textAlign=al;ctx.textBaseline='middle';ctx.lineWidth=3.5;ctx.strokeStyle=css('--ground');ctx.strokeText(r.n,lx,ly);
    ctx.fillStyle=css('--ink');ctx.fillText(r.n,lx,ly);});ctx.restore();}};
function cfg(t){
  const LAMP=css('--lamp'),DIM=css('--dim'),SOFT=css('--ink-soft'),RULE=css('--rule'),G=css('--ground'),INK=css('--ink');
  const base=D.base.filter(p=>!p.m),mars=D.base.filter(p=>p.m);
  return {type:'scatter',data:{datasets:[
    {type:'line',data:curva(1),borderWidth:0,pointRadius:0,fill:'+1',backgroundColor:LAMP+'1F',tooltip:false,order:5},
    {type:'line',data:curva(-1),borderWidth:0,pointRadius:0,fill:false,order:5},
    {type:'line',data:curva(0),borderColor:LAMP,borderWidth:2,pointRadius:0,order:4},
    {data:base,backgroundColor:DIM,borderWidth:0,pointRadius:2.6*R(),pointHoverRadius:5,order:3},
    {data:mars,backgroundColor:'transparent',borderColor:SOFT,borderWidth:1.2,pointRadius:3.4*R(),pointHoverRadius:5.5,order:3},
    {data:D.clave,clave:true,backgroundColor:LAMP,borderColor:G,borderWidth:1.2,pointRadius:5.5*R(),pointHoverRadius:7.5,order:1}]},
  options:{responsive:true,maintainAspectRatio:false,animation:false,
    interaction:{mode:'nearest',intersect:true},
    plugins:{legend:{display:false},tooltip:{
      filter:it=>it.dataset.type!=='line',
      backgroundColor:css('--surface'),borderColor:RULE,borderWidth:1,titleColor:INK,bodyColor:SOFT,
      padding:10,titleFont:{size:13,weight:'600'},bodyFont:{size:11.5},bodySpacing:3,
      callbacks:{title:it=>it.length?[it[0].raw.n]:[],
        label:it=>{const r=it.raw,f=r.y/r.p;const o=[r.s,'Gestación: '+Math.round(r.x)+' días','Longevidad: '+fmt(r.y)+' años',
          'Esperado por su gestación: '+fmt(r.p)+' años','Vive ×'+(Math.round(f*100)/100).toFixed(2)+' lo esperado'];
          if(r.m)o.push('Marsupial o monotrema');if(r.f){o.push('');wrap(r.f,40).forEach(l=>o.push(l));}return o;}}}},
    scales:{
      x:{type:t,min:t==='logarithmic'?8:0,max:720,title:{display:true,text:'Gestación (días)',color:SOFT},
         grid:{color:RULE},ticks:{color:SOFT,callback:v=>t==='logarithmic'?([10,20,50,100,200,500].includes(v)?v:''):v}},
      y:{type:t,min:t==='logarithmic'?1.8:0,max:t==='logarithmic'?260:220,title:{display:true,text:'Longevidad máxima (años)',color:SOFT},
         grid:{color:RULE},ticks:{color:SOFT,callback:v=>t==='logarithmic'?([2,5,10,20,50,100,200].includes(v)?v:''):v}}}},
  plugins:[lbl]};}
let escala='logarithmic',chart;
function dibuja(){if(chart)chart.destroy();chart=new Chart(document.getElementById('c'),cfg(escala));
  document.getElementById('blog').classList.toggle('on',escala==='logarithmic');
  document.getElementById('blin').classList.toggle('on',escala==='linear');}
function tema(){try{const t=localStorage.getItem('av-tema');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}}
tema();dibuja();
document.getElementById('blog').onclick=()=>{escala='logarithmic';dibuja();};
document.getElementById('blin').onclick=()=>{escala='linear';dibuja();};
addEventListener('storage',e=>{if(e.key==='av-tema'){tema();dibuja();}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',dibuja);
</script>
